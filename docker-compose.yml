# ========================================================
# Khamsa CMS - Production Docker Compose
# Brand: خمسة برمجة بالبلدي
# ========================================================

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khamsa-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    networks:
      - khamsa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khamsa-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - khamsa-network

networks:
  khamsa-network:
    driver: bridge
